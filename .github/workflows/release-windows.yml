name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv

      - name: Install project dependencies
        shell: pwsh
        run: |
          uv sync --frozen
          uv pip install pyinstaller

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "VERSION must use MAJOR.MINOR.PATCH format. Got: $version"
          }

          if ("${{ github.ref_type }}" -eq "tag") {
              $expectedTag = "v$version"

              if ("${{ github.ref_name }}" -ne $expectedTag) {
                  throw "Git tag ${{ github.ref_name }} does not match VERSION ($expectedTag)."
              }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building EU5 AI Companion $version"

      - name: Build versioned application
        shell: pwsh
        run: |
          uv run pyinstaller `
              --noconfirm `
              --clean `
              --workpath ".\build-app" `
              --distpath ".\dist-app" `
              ".\EU5 AI Companion App.spec"

      - name: Build stable launcher
        shell: pwsh
        run: |
          uv run pyinstaller `
              --noconfirm `
              --clean `
              --workpath ".\build-launcher" `
              --distpath ".\dist-launcher" `
              ".\EU5 AI Companion Launcher.spec"

      - name: Create portable package, update payload and manifest
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseDir = Join-Path $PWD "release"
          $stageRoot = Join-Path $PWD "release-stage"
          $portableRoot = Join-Path $stageRoot "EU5 AI Companion"
          $portableApp = Join-Path $portableRoot "app\$env:VERSION"

          $appBuild = Join-Path $PWD "dist-app\EU5 AI Companion App"
          $launcherExe = Join-Path $PWD "dist-launcher\EU5 AI Companion.exe"

          New-Item -ItemType Directory -Force $releaseDir | Out-Null
          New-Item -ItemType Directory -Force $portableApp | Out-Null

          if (-not (Test-Path $launcherExe)) {
              throw "Launcher build missing: $launcherExe"
          }

          if (-not (Test-Path (Join-Path $appBuild "EU5 AI Companion App.exe"))) {
              throw "Application build missing."
          }

          Copy-Item $launcherExe (Join-Path $portableRoot "EU5 AI Companion.exe")
          Copy-Item (Join-Path $appBuild "*") $portableApp -Recurse -Force

          @{
              version = $env:VERSION
          } |
              ConvertTo-Json |
              Set-Content (Join-Path $portableRoot "current.json") -Encoding UTF8

          $updateZipName = "EU5-AI-Companion-App-$env:VERSION-win-x64.zip"
          $updateZipPath = Join-Path $releaseDir $updateZipName

          Compress-Archive `
              -Path (Join-Path $appBuild "*") `
              -DestinationPath $updateZipPath `
              -CompressionLevel Optimal

          $portableZipName = "EU5-AI-Companion-$env:VERSION-win-x64.zip"
          $portableZipPath = Join-Path $releaseDir $portableZipName

          Compress-Archive `
              -Path $portableRoot `
              -DestinationPath $portableZipPath `
              -CompressionLevel Optimal

          $updateSha = (
              Get-FileHash $updateZipPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $portableSha = (
              Get-FileHash $portableZipPath -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $packageUrl = (
              "https://github.com/${{ github.repository }}/" +
              "releases/download/v$env:VERSION/$updateZipName"
          )

          $manifest = [ordered]@{
              schema = 1
              channel = "stable"
              version = $env:VERSION
              launcher_protocol = 1
              package_url = $packageUrl
              sha256 = $updateSha
          }

          $manifest |
              ConvertTo-Json |
              Set-Content (Join-Path $releaseDir "update.json") -Encoding UTF8

          @(
              "$portableSha  $portableZipName"
              "$updateSha  $updateZipName"
          ) |
              Set-Content (Join-Path $releaseDir "SHA256SUMS.txt") -Encoding ASCII

          Write-Host "Portable package: $portableZipName"
          Write-Host "Update payload:   $updateZipName"
          Write-Host "Update SHA256:    $updateSha"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EU5-AI-Companion-${{ steps.version.outputs.version }}-win-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:VERSION" `
              "release\EU5-AI-Companion-$env:VERSION-win-x64.zip" `
              "release\EU5-AI-Companion-App-$env:VERSION-win-x64.zip" `
              "release\update.json" `
              "release\SHA256SUMS.txt" `
              --title "EU5 AI Companion v$env:VERSION" `
              --generate-notes
