name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install uv and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv pyinstaller

      - name: Install project dependencies
        shell: pwsh
        run: |
          uv sync --frozen

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()

          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "VERSION must use MAJOR.MINOR.PATCH format. Got: $version"
          }

          if ("${{ github.ref_type }}" -eq "tag") {
              $expectedTag = "v$version"

              if ("${{ github.ref_name }}" -ne $expectedTag) {
                  throw "Git tag ${{ github.ref_name }} does not match VERSION ($expectedTag)."
              }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building EU5 AI Companion $version"

      - name: Build application
        shell: pwsh
        run: |
          uv run pyinstaller `
              --noconfirm `
              --clean `
              --workpath ".\build-release" `
              --distpath ".\dist-release" `
              ".\EU5 AI Companion.spec"

      - name: Create release package and manifest
        id: package
        shell: pwsh
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $releaseDir = Join-Path $PWD "release"
          $appDir = Join-Path $PWD "dist-release\EU5 AI Companion"

          New-Item -ItemType Directory -Force $releaseDir | Out-Null

          $zipName = "EU5-AI-Companion-$env:VERSION-win-x64.zip"
          $zipPath = Join-Path $releaseDir $zipName

          Compress-Archive `
              -Path (Join-Path $appDir "*") `
              -DestinationPath $zipPath `
              -CompressionLevel Optimal

          $sha256 = (Get-FileHash $zipPath -Algorithm SHA256).Hash.ToLowerInvariant()

          $packageUrl = "https://github.com/${{ github.repository }}/releases/download/v$env:VERSION/$zipName"

          $manifest = [ordered]@{
              schema = 1
              channel = "stable"
              version = $env:VERSION
              launcher_protocol = 1
              package_url = $packageUrl
              sha256 = $sha256
          }

          $manifest |
              ConvertTo-Json |
              Set-Content `
                  (Join-Path $releaseDir "update.json") `
                  -Encoding UTF8

          "$sha256  $zipName" |
              Set-Content `
                  (Join-Path $releaseDir "SHA256SUMS.txt") `
                  -Encoding ASCII

          "zip_path=$zipPath" >> $env:GITHUB_OUTPUT
          "zip_name=$zipName" >> $env:GITHUB_OUTPUT
          "sha256=$sha256" >> $env:GITHUB_OUTPUT

          Write-Host "Package: $zipName"
          Write-Host "SHA256:  $sha256"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: EU5-AI-Companion-${{ steps.version.outputs.version }}-win-x64
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$env:VERSION" `
              "release\EU5-AI-Companion-$env:VERSION-win-x64.zip" `
              "release\update.json" `
              "release\SHA256SUMS.txt" `
              --title "EU5 AI Companion v$env:VERSION" `
              --generate-notes
